<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici">
    <section class="kart giris-kutu">
      <h1>Yemekhane Otomasyonu</h1>
      <p class="soluk">Kampüs yemekhanesi menü, rezervasyon ve bakiye işlemleri.</p>
      <div id="bildirim" class="bildirim"></div>
      <form id="giris-formu" novalidate>
        <div class="alan">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" required>
        </div>
        <div class="alan">
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
        </div>
        <button class="dugme dugme-tam" type="submit" id="giris-dugme">Giriş yap</button>
      </form>
    </section>
  </main>
  <script src="/js/ortak.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
